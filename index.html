<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to ServiceHub - The modern platform connecting customers with trusted service merchants.">
  <title>Sign In &bull; ServiceHub</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-container">
    <div class="login-wrapper">
      
      <!-- Brand Header -->
      <div class="brand-header">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="10" fill="#2563EB"/>
            <path d="M20 9L29.5 14.5V25.5L20 31L10.5 25.5V14.5L20 9Z" stroke="white" stroke-width="2.2" stroke-linejoin="round"/>
            <circle cx="20" cy="20" r="3.5" fill="white"/>
            <line x1="20" y1="9" x2="20" y2="16.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line x1="29.5" y1="25.5" x2="23" y2="21.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line x1="10.5" y1="25.5" x2="17" y2="21.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="brand-name">Service<span>Hub</span></h1>
      </div>

      <!-- Login Card -->
      <div class="login-card">
        <header class="card-header">
          <h2 class="card-title">Welcome back</h2>
          <p class="card-subtitle" id="role-subtitle">Sign in to book and track your service requests</p>
        </header>

        <!-- Role Selector (Customer / Merchant) -->
        <fieldset class="role-selector" aria-label="Account Type Selection">
          <legend class="visually-hidden">Choose Account Type</legend>
          <div class="role-tabs" role="tablist">
            <button 
              type="button" 
              role="tab" 
              id="role-tab-customer" 
              class="role-tab active" 
              aria-selected="true" 
              aria-controls="login-form" 
              data-role="customer">
              <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" width="18" height="18">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
              </svg>
              <span>Customer</span>
            </button>
            <button 
              type="button" 
              role="tab" 
              id="role-tab-merchant" 
              class="role-tab" 
              aria-selected="false" 
              aria-controls="login-form" 
              data-role="merchant">
              <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" width="18" height="18">
                <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4zm3 1h6v4H7V5zm8 8v2h1a1 1 0 001-1v-1h-2zm-2 2H7v-2h6v2zm-8 0h1v-2H5v1a1 1 0 001 1z" clip-rule="evenodd"/>
              </svg>
              <span>Merchant</span>
            </button>
          </div>
        </fieldset>

        <!-- Status Notification (Success/Error banner for demonstration) -->
        <div id="status-message" class="status-banner" role="status" aria-live="polite" hidden></div>

        <!-- Login Form -->
        <form id="login-form" class="login-form" novalidate method="POST" action="#">
          <!-- Hidden Role Input to pass role with form submit -->
          <input type="hidden" name="user_role" id="user-role-input" value="customer">

          <!-- Email Input Group -->
          <div class="form-group" id="group-email">
            <label for="email" class="form-label">Email address</label>
            <div class="input-container">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="20" height="16" x="2" y="4" rx="2"/>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
              </span>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-input" 
                placeholder="name@example.com" 
                autocomplete="email" 
                required 
                aria-describedby="email-error">
            </div>
            <div id="email-error" class="input-feedback" aria-live="polite">
              Please enter a valid email address.
            </div>
          </div>

          <!-- Password Input Group -->
          <div class="form-group" id="group-password">
            <div class="label-row">
              <label for="password" class="form-label">Password</label>
              <a href="#forgot-password" id="forgot-password-link" class="text-link forgot-link">Forgot password?</a>
            </div>
            <div class="input-container">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input has-toggle" 
                placeholder="Enter your password" 
                autocomplete="current-password" 
                required 
                aria-describedby="password-error">
              <button 
                type="button" 
                id="toggle-password" 
                class="password-toggle-btn" 
                aria-label="Show password" 
                aria-pressed="false">
                <!-- Eye Open Icon -->
                <svg class="eye-icon eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <!-- Eye Slash Icon -->
                <svg class="eye-icon eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m9.88 9.88 4.24 4.24m.56-4.24-4.24 4.24"/>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                  <line x1="2" x2="22" y1="2" y2="22"/>
                </svg>
              </button>
            </div>
            <div id="password-error" class="input-feedback" aria-live="polite">
              Password cannot be empty.
            </div>
          </div>

          <!-- Remember Me Checkbox -->
          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" id="remember-me" name="remember_me" class="checkbox-input">
              <span class="checkbox-box" aria-hidden="true">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
              <span class="checkbox-label">Remember me for 30 days</span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="login-button" class="btn btn-primary">
            <span class="btn-text">Sign In</span>
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14"/>
              <path d="m12 5 7 7-7 7"/>
            </svg>
          </button>
        </form>

        <!-- Sign Up Link -->
        <footer class="card-footer">
          <p class="signup-prompt">
            Don't have an account? 
            <a href="signup.html" id="signup-link" class="text-link signup-link">Sign up</a>
          </p>
        </footer>
      </div>

      <!-- Minimal Brand Footer -->
      <aside class="page-footer">
        <p>&copy; 2026 ServiceHub Inc. All rights reserved.</p>
      </aside>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
